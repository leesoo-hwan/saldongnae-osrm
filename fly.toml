app = "saldongnae-osrm"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  REGION_NAME = "south-korea"
  PBF_URL = "https://download.geofabrik.de/asia/south-korea-latest.osm.pbf"
  PROFILE = "/opt/car.lua"
  ALGO = "mld"

[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "osrm_data"
  destination = "/data"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 5000
  force_https = true
  min_machines_running = 0
