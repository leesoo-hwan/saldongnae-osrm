app = "saldongnae-osrm"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  REGION_NAME = "south-korea"
  PBF_URL = "https://download.geofabrik.de/asia/south-korea-latest.osm.pbf"
  PROFILE = "/opt/car.lua"
  ALGO = "mld"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "osrm_data"
  destination = "/data"

[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"

